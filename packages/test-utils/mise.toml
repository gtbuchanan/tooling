[tasks."typecheck:ts"]
depends = []
run = "pnpm run gtb task typecheck:ts"
sources = [ "../../tsconfig.base.json", "bin/**", "scripts/**", "src/**", "test/**", "e2e/**", "*.cjs", "*.cts", "*.js", "*.jsx", "*.mjs", "*.mts", "*.ts", "*.tsx", ".*.cjs", ".*.cts", ".*.js", ".*.jsx", ".*.mjs", ".*.mts", ".*.ts", ".*.tsx", "tsconfig.json", "tsconfig.*.json" ]

[tasks."typecheck:ts".outputs]
auto = true


[tasks.noop]
run = 'echo noop'

