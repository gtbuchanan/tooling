# The oldest mise that reads mise.lock's `lockfile_version = 3`, declared so an
# older one fails with a version error instead of a confusing lockfile one.
# This floor also covers minimum_release_age_excludes (below), added in
# 2026.6.2. CI pins its own version in `.github/actions/mise-setup`, which only
# has to stay at or above this.
min_version = "2026.9.16"

[env]
# hk wraps hook steps in `mise x` so mise-managed tools resolve without
# activation.
HK_MISE = "1"

[hooks]
postinstall = "hk install --mise"

[settings]
# Required for the `[hooks]` table.
experimental = true
lockfile = true
# Matches the Renovate/pnpm 3-day quarantine. Only filters fuzzy/`latest`
# resolution (e.g. manual `mise up --bump`); install of the exact pins
# in `[tools]` bypasses it, and Renovate already gates automated bumps at
# 3 days.
minimum_release_age = "3d"
# Self-published packages never need the supply-chain quarantine — exclude
# them so fuzzy/`latest` resolution picks up our own just-cut releases.
minimum_release_age_excludes = ["npm:@gtbuchanan/*"]

# mise.tasks.toml is generated and owned by `gtb sync`; this include is
# the one manual hookup (gtb verify checks it).
[task_config]
includes = ["mise.tasks.toml"]

# pnpm ignores the `os` field on workspace packages, so the Termux shim's
# bin doesn't get auto-symlinked into node_modules/.bin via the usual
# optionalDependencies path. `bootstrap` does it explicitly on Termux.
[tasks.bootstrap]
description = "Set up the workspace (install deps; symlink Termux pnpm shim)"
run = [
  "pnpm install --frozen-lockfile",
  'if [ "$(uname -o)" = "Android" ]; then ln -sfn ../../packages/pnpm-termux-shim/bin/pnpm node_modules/.bin/pnpm; fi',
]
run_windows = "pnpm install --frozen-lockfile"

[tools]
hk = "2.8.1"
jactionlint = "2.3.0"
node = "24.22.2"
# Exempt transitive `@yarnpkg/libzip` from aube's no-downgrade policy — its
# latest is a benign manual publish missing the provenance its CI releases had.
"npm:renovate" = { trust_policy_excludes = [
  "@yarnpkg/libzip",
], version = "44.176.2" }
pkl = "0.32.2"
# Deliberately duplicates `packageManager` in package.json (turbo requires
# that field). Renovate groups both bumps into one PR — see the "pnpm"
# packageRule in default.json. Reading the version from package.json via
# `idiomatic_version_file_enable_tools` avoided the duplication but left
# mise.lock unbumped, failing every `MISE_LOCKED=1` install.
pnpm = "12.16.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
