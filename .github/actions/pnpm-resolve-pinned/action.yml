---
description: Resolve a package's locked version from pnpm-lock.yaml (no install required)
inputs:
  package:
    description: Package name to resolve (e.g. @changesets/cli)
    required: true
name: pnpm Resolve Pinned
outputs:
  version:
    description: Exact version from the lockfile
    value: ${{ steps.resolve.outputs.version }}
runs:
  steps:
    - env:
        PACKAGE: ${{ inputs.package }}
      id: resolve
      run: |
        version=$(pnpm ls --lockfile-only -w --depth 0 "$PACKAGE" --json \
          | jq -r --arg package "$PACKAGE" '.[0].devDependencies[$package].version')
        if [ -z "$version" ] || [ "$version" = "null" ]; then
          echo "::error::Failed to resolve version for $PACKAGE"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
      shell: bash
  using: composite
