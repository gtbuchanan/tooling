---
description: Download an artifact on GitHub, Forgejo or Gitea
inputs:
  name:
    description: Artifact name
    required: true
  path:
    default: .
    description: Directory to restore the artifact into
    required: false
name: Download Artifact
runs:
  # Paired like upload-artifact; see the comment there. The fork stays on v4
  # because the v8 download reports success on Forgejo 17.0.1 while leaving
  # the artifact zipped.
  steps:
    - if: ${{ github.server_url == 'https://github.com' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
    - if: ${{ github.server_url != 'https://github.com' }}
      uses: ChristopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7 # v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
  using: composite
