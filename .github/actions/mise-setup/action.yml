---
description: Install and cache mise-managed dev tools with partial-restore caching
name: mise Setup
outputs:
  cache-hit:
    description: Whether the exact mise.lock-keyed cache was hit
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  steps:
    # Centralize MISE_DATA_DIR so the cache path is OS-agnostic and the
    # value is visible to subsequent prune/exec steps. MISE_LOCKED=1
    # makes `mise install` fail if mise.toml drifts from mise.lock
    # (analogous to pnpm `--frozen-lockfile`). jdx/mise-action already
    # sets MISE_YES + MISE_TRUSTED_CONFIG_PATHS, so trust prompts and
    # interactive confirmations are handled by the action itself.
    #
    # MISE_GITHUB_TOKEN is set here rather than left to mise-action's
    # own github_token input (which already defaults to github.token).
    # The action exports that variable only *after* it has run
    # `mise self-update`, so when a restored cache holds a different
    # mise version than the pinned one below, self-update queries the
    # GitHub releases API unauthenticated and 403s under rate limiting.
    # Presetting wins because the action skips any variable already in
    # the environment. See jdx/mise-action#292; drop this line once the
    # action exports the token before it self-updates.
    - env:
        DATA_DIR: ${{ runner.temp }}/.mise
        GH_TOKEN: ${{ github.token }}
      name: Configure mise environment
      run: |
        {
          echo "MISE_DATA_DIR=${DATA_DIR}"
          echo "MISE_GITHUB_TOKEN=${GH_TOKEN}"
          echo "MISE_LOCKED=1"
        } >> "$GITHUB_ENV"
      shell: bash

    - id: cache
      name: Restore mise data
      uses: actions/cache@v6
      with:
        key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
        path: ${{ runner.temp }}/.mise
        restore-keys: |
          mise-${{ runner.os }}-${{ runner.arch }}-

    # mise-action unzips mise under os.tmpdir() then renames (io.mv) the binary
    # into MISE_DATA_DIR. On Windows os.tmpdir() is on C: but MISE_DATA_DIR sits
    # on runner.temp (D:), and the cross-drive rename fails with EXDEV — so point
    # the process temp at the same volume as MISE_DATA_DIR for this step.
    - env:
        TEMP: ${{ runner.temp }}
        TMP: ${{ runner.temp }}
        TMPDIR: ${{ runner.temp }}
      uses: jdx/mise-action@v4.3.0
      with:
        cache: false
        version: 2026.9.1

    # Prune unreferenced tool versions on inexact cache restore so the
    # re-saved cache does not grow unbounded across mise.lock changes
    - if: steps.cache.outputs.cache-hit != 'true'
      name: Prune mise data
      run: mise prune --yes
      shell: bash
  using: composite
