---
description: Install and cache mise-managed dev tools with partial-restore caching
name: mise Setup
outputs:
  cache-hit:
    description: Whether the exact mise.lock-keyed cache was hit
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  steps:
    # Centralize MISE_DATA_DIR so the cache path is OS-agnostic and the
    # value is visible to subsequent prune/exec steps. MISE_LOCKED=1
    # makes `mise install` fail if mise.toml drifts from mise.lock
    # (analogous to pnpm `--frozen-lockfile`). jdx/mise-action already
    # sets MISE_YES + MISE_TRUSTED_CONFIG_PATHS, so trust prompts and
    # interactive confirmations are handled by the action itself.
    - env:
        DATA_DIR: ${{ runner.temp }}/.mise
      name: Configure mise environment
      run: |
        {
          echo "MISE_DATA_DIR=${DATA_DIR}"
          echo "MISE_LOCKED=1"
        } >> "$GITHUB_ENV"
      shell: bash

    # The cache holds installed tools, which run only on the image they were
    # installed on, and runner.os reads `Linux` on every Ubuntu release. On
    # Windows, uname -s carries the OS build.
    - id: platform
      name: Resolve OS release
      run: |
        case "$(uname -s)" in
          Darwin) os_release="macos-$(sw_vers -productVersion | cut -d. -f1)" ;;
          Linux) os_release="$(. /etc/os-release && echo "${ID:-linux}-${VERSION_ID:-}")" ;;
          *) os_release="$(uname -s)" ;;
        esac
        echo "os-release=${os_release}" >> "$GITHUB_OUTPUT"
      shell: bash

    - id: cache
      name: Restore mise data
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: mise-${{ steps.platform.outputs.os-release }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}
        path: ${{ runner.temp }}/.mise
        restore-keys: |
          mise-${{ steps.platform.outputs.os-release }}-${{ runner.arch }}-

    # mise-action unzips mise under os.tmpdir() then renames (io.mv) the binary
    # into MISE_DATA_DIR. On Windows os.tmpdir() is on C: but MISE_DATA_DIR sits
    # on runner.temp (D:), and the cross-drive rename fails with EXDEV — so point
    # the process temp at the same volume as MISE_DATA_DIR for this step.
    #
    # github_token defaults to github.token, which on Forgejo and Gitea is the
    # forge's own job token: GitHub rejects it with a 401. Pass it only on
    # github.com and let mise call the GitHub API anonymously elsewhere.
    - env:
        TEMP: ${{ runner.temp }}
        TMP: ${{ runner.temp }}
        TMPDIR: ${{ runner.temp }}
      uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        cache: false
        github_token: ${{ github.server_url == 'https://github.com' && github.token || '' }}
        version: 2026.11.0

    # Prune unreferenced tool versions on inexact cache restore so the
    # re-saved cache does not grow unbounded across mise.lock changes
    - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      name: Prune mise data
      run: mise prune --yes
      shell: bash
  using: composite
