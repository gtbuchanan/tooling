---
description: Upload an artifact on GitHub, Forgejo or Gitea
inputs:
  if-no-files-found:
    default: warn
    description: What to do when path matches nothing (warn, error or ignore)
    required: false
  name:
    description: Artifact name
    required: true
  path:
    description: Newline-separated files, directories or globs to upload
    required: true
name: Upload Artifact
runs:
  # The upstream action refuses to run on any server_url other than
  # github.com, which it takes for GHES, so Forgejo and Gitea get
  # ChristopherHX's fork, which drops that check. `uses:` can't be an
  # expression, hence the `if:` on each half. The fork lives on GitHub so a
  # bare `owner/repo@ref` resolves on both forges; the `https://` ref Forgejo
  # also accepts is not a GitHub action reference, and jactionlint rejects it.
  #
  # The fork stays on v4 rather than the upstream major: Forgejo 17.0.1
  # rejects the `mime_type` field the v7 upload sends. It publishes branches
  # rather than tags, and the branches move, so it is pinned to a commit.
  steps:
    - if: ${{ github.server_url == 'https://github.com' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        if-no-files-found: ${{ inputs.if-no-files-found }}
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
    - if: ${{ github.server_url != 'https://github.com' }}
      uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # v4
      with:
        if-no-files-found: ${{ inputs.if-no-files-found }}
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
  using: composite
