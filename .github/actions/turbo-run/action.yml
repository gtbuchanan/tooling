---
description: Run a turbo task, skipping pnpm install on full cache hit (mise-setup must run first)
inputs:
  task:
    description: Turbo task to run (e.g., build:ci, test:e2e)
    required: true
name: Turbo Run
outputs:
  cache-hit:
    description: Whether all turbo tasks were cache hits
    value: ${{ steps.cache-check.outputs.hit }}
runs:
  steps:
    - id: turbo-version
      uses: gtbuchanan/tooling/.github/actions/pnpm-resolve-pinned@main
      with:
        package: turbo

    - uses: rharkor/caching-for-turbo@v2.5.1

    - env:
        TURBO_GLOBAL_WARNING_DISABLED: '1'
        TURBO_TASK: ${{ inputs.task }}
        TURBO_VERSION: ${{ steps.turbo-version.outputs.version }}
      id: cache-check
      name: Check turbo cache
      # Workspace edits fully invalidate the cache — see "Turbo cache
      # miss on workspace edits" in AGENTS.md. The check still pays off
      # on root-only edits and re-runs.
      run: |
        hit=false
        if dry=$(pnpm dlx "turbo@${TURBO_VERSION}" run "$TURBO_TASK" --dry=json); then
          # A cache hit replays a task's outputs instead of running its
          # command, so the install is dispensable only when every task
          # that would execute is a hit. Weigh each task that has a
          # command; the ones without are aggregates and never run.
          filter='.tasks[] | select(.command != "" and .command != "<NONEXISTENT>")'
          considered=$(echo "$dry" | jq "[${filter}] | length")
          misses=$(echo "$dry" | jq "[${filter} | select(.cache.status != \"HIT\")] | length")
          # An empty set is an absence of evidence rather than evidence of
          # a hit. A `cache: false` task reports a miss and holds the
          # install here, which is what it needs: it runs every time, and
          # its command wants node_modules.
          if [ "$considered" -gt 0 ] && [ "$misses" -eq 0 ]; then
            hit=true
          fi
        else
          echo "::warning::turbo dry-run failed; falling back to full install"
        fi
        echo "hit=$hit" >> "$GITHUB_OUTPUT"
      shell: bash

    - if: steps.cache-check.outputs.hit != 'true'
      uses: gtbuchanan/tooling/.github/actions/pnpm-tasks@main

    - env:
        TURBO_GLOBAL_WARNING_DISABLED: '1'
        TURBO_TASK: ${{ inputs.task }}
        TURBO_VERSION: ${{ steps.turbo-version.outputs.version }}
      name: Run turbo task
      run: pnpm dlx "turbo@${TURBO_VERSION}" run "$TURBO_TASK"
      shell: bash
  using: composite
