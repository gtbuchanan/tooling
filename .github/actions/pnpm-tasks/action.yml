---
description: Restore the pnpm store and install dependencies (mise-setup must run first)
inputs:
  commands:
    default: ''
    description: Newline-delimited pnpm commands to run after install (e.g. compile)
name: pnpm Tasks
runs:
  steps:
    - id: pnpm-store
      name: Resolve pnpm store path
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      shell: bash

    - id: pnpm-cache
      name: Restore pnpm store
      uses: actions/cache@v6
      with:
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        path: ${{ steps.pnpm-store.outputs.path }}
        restore-keys: |
          pnpm-${{ runner.os }}-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    # The install above reports nothing about peers: strictPeerDependencies is
    # enforced during resolution, and a frozen install skips resolution while
    # the lockfile is up to date. So without this step a mismatch reaches CI
    # unremarked however the consumer configured pnpm.
    #
    # What the setting does still express is whether a mismatch ought to be
    # fatal, so read it rather than decide for the consumer: a repository that
    # set it gets the failure it asked for, and one that did not gets a warning
    # instead of a build break it never opted into.
    - name: Check peer dependencies
      run: |
        set -euo pipefail
        if pnpm peers check; then
          exit 0
        fi
        # Strip with bash's own expansion rather than tr: this step's job is to
        # decide whether a mismatch is fatal, so a missing external binary would
        # fail the very repository the non-strict branch exists to keep passing.
        strict="$(pnpm config get strict-peer-dependencies)"
        strict="${strict//[[:space:]]/}"
        if [ "$strict" = "true" ]; then
          msg="Unmet peer dependencies, and strictPeerDependencies is set."
          echo "::error::$msg"
          exit 1
        fi
        msg="Unmet peer dependencies. Set strictPeerDependencies in"
        msg="$msg pnpm-workspace.yaml to make this fail the build."
        echo "::warning::$msg"
      shell: bash

    - env:
        COMMANDS: ${{ inputs.commands }}
      if: inputs.commands != ''
      name: Run pnpm commands
      run: |
        while IFS= read -r cmd; do
          [ -n "$cmd" ] && pnpm $cmd
        done <<< "$COMMANDS"
      shell: bash

    # Prune stale packages on inexact cache restore so the re-saved cache
    # does not grow unbounded
    - if: steps.pnpm-cache.outputs.cache-hit != 'true'
      name: Prune pnpm store
      run: pnpm store prune
      shell: bash
  using: composite
