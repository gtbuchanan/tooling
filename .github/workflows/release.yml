---
# Runs queue rather than cancel: cancelling CD partway through publishing
# would leave npm and the GitHub releases out of step. A newer pending run
# still replaces an older pending one, and its CD releases everything the
# skipped commits carried. The `-caller` part keeps the group distinct from
# any a reusable builds from `github.workflow`, which is this workflow's name
# there too.
concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-caller-${{ github.ref }}

jobs:
  cd:
    name: CD
    needs: ci
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/cd.yml
    with:
      # tooling vendors @gtbuchanan/cli as a workspace package, so CD runs gtb
      # from source (`pnpm run gtb`) rather than an installed bin.
      gtb-from-source: true

  ci:
    name: CI
    secrets: inherit
    uses: ./.github/workflows/ci.yml

name: Release

# The main-branch pipeline: re-run CI as a gate, then CD (version +
# publish via cd.yml). CI and CD are peer jobs. The CD job grants the
# superset its publish step needs — a called workflow can only narrow
# the caller's token, never elevate it.
on:
  push:
    branches: [main]

permissions:
  contents: read
