---
env:
  # GitHub Actions has no TTY, so force color: hk honors CLICOLOR_FORCE
  # and Node tools (eslint etc.) honor FORCE_COLOR. Actions renders the ANSI.
  CLICOLOR_FORCE: '1'
  FORCE_COLOR: '1'

jobs:
  run:
    name: Pre-Commit Run
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gtbuchanan/tooling/.github/actions/mise-setup@main

      # The eslint step shells out to `pnpm exec eslint`, so it needs
      # node_modules. Node-free consumers set `use-pnpm: false` to skip
      # this and run the builtin/tool-backed hooks alone.
      #
      # `pnpm-commands` serves the repo whose linted source imports a
      # generated file: in a fresh checkout that import resolves to the
      # `error` type and the type-aware rules fire on code that is fine.
      # The commands run through pnpm, so they install too. Gating them
      # on `use-pnpm` would skip the step that runs them and leave the
      # hooks reading the tree they exist to complete.
      - if: ${{ inputs.use-pnpm || inputs.pnpm-commands != '' }}
        uses: gtbuchanan/tooling/.github/actions/pnpm-tasks@main
        with:
          commands: ${{ inputs.pnpm-commands }}

      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        name: Run hk on the PR's changed files
        run: mise run hk:base -- "$BASE_SHA"
        shell: bash
    timeout-minutes: 15

name: Pre-Commit

on:
  workflow_call:
    inputs:
      pnpm-commands:
        default: ''
        description: >-
          Newline-delimited commands to run through pnpm after install, so
          hk steps see files a codegen task writes (e.g. `exec turbo run
          generate`). Implies `use-pnpm`.
        type: string
      use-pnpm:
        default: false
        description: >-
          Run `pnpm install` so hk steps that shell out to the project's
          pnpm deps (e.g. the `pnpm exec eslint` step) can resolve them.
          Leave false when no step needs them.
        type: boolean

permissions:
  contents: read
