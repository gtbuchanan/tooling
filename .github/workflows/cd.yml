---
jobs:
  # Requires npm trusted publishing (OIDC) configured for each package.
  publish:
    environment: release
    if: needs.version.outputs.hasChangesets == 'false'
    name: Publish
    needs: version
    # The job token only checks out and fetches: every release, tag and Git
    # Data API write goes through the App token below.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gtbuchanan/tooling/.github/actions/mise-setup@main

      - uses: gtbuchanan/tooling/.github/actions/turbo-run@main
        with:
          task: pack

      # `pnpm-tasks` restores node_modules for `pnpm exec gtb`, since turbo-run
      # skips install on a pack cache hit.
      - uses: gtbuchanan/tooling/.github/actions/pnpm-tasks@main

      # Releases are cut as the GitHub App rather than with the job token, for
      # two reasons. The workflows release commits a tree whose
      # `.github/workflows/` differs from HEAD, which GitHub refuses without the
      # `workflows` permission, and the job token cannot hold that permission.
      # And a ruleset can name the App as the one actor allowed to create
      # release tags, where it refuses the GitHub Actions integration as a
      # bypass actor.
      #
      # The token is narrowed to what publishing writes: releases and tags
      # (contents) and a release tree under `.github/workflows/` (workflows).
      # Asking for `workflows` fails token creation where the App lacks it,
      # so the App needs it even in a repository with no `.github` package.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          permission-contents: write
          permission-workflows: write
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # `gtb publish` runs `changeset publish` (npm), creates the GitHub
      # releases that land each published package's release tag (changesets
      # only tags the local clone), then every non-npm channel. OIDC trusted
      # publishing + provenance flow through the ambient env set here (the
      # `release` environment + `id-token: write` grant them); GH_TOKEN covers
      # the release creation.
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: 'true'
          PNPM_GTB_COMMAND: ${{ inputs.gtb-from-source && 'run' || 'exec' }}
        name: Publish packages
        run: pnpm "$PNPM_GTB_COMMAND" gtb publish

  version:
    # For the App key, which lives in the environment (see the header).
    environment: release
    name: Version
    outputs:
      hasChangesets: ${{ steps.changesets-action.outputs.has-changesets }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: gtbuchanan/tooling/.github/actions/mise-setup@main

      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # Input rename only — `client-id` replaces the deprecated `app-id`,
          # and the JWT `iss` claim it feeds accepts an App ID either way.
          client-id: ${{ vars.APP_ID }}
          # Narrowed to what the release PR writes: its branch and commit
          # (contents), the PR itself (pull-requests), and workflows, because
          # resetting the release branch onto a main whose
          # `.github/workflows/` moved is refused without it.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # `gtb version` needs node_modules (the local changeset bin + gtb itself).
      - uses: gtbuchanan/tooling/.github/actions/pnpm-tasks@main

      # `gtb version` runs `changeset version` then a full sync in one process
      # so version-stamped files such as a PklProject land in the same version
      # commit/PR, then `hk fix` over the files both wrote, so the release PR
      # passes its own `Pre-Commit` check (and `HK=0` below skips only hk's
      # git hook, not this). It can't be a `&&`
      # chain in this input: changesets/action splits `version-script` on
      # whitespace and execs it without a shell, so `&&` (and everything after)
      # would be passed to changesets as bogus positional args ("Too many
      # arguments passed to changesets").
      #
      # `HK=0` skips the hk pre-commit hook on changesets/action's automated
      # commit (mise's postinstall installs the hook in CI too). A
      # machine-generated release commit shouldn't run dev hooks — the release
      # PR's own `Pre-Commit` CI is the enforcement point.
      - env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          HK: '0'
        id: changesets-action
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          # `push-with-git-cli` stays at its `false` default: pushing the
          # version commit + tags through the GitHub API GPG-signs them and
          # attributes them to the app that owns `github-token`. The git-cli
          # path leaves them unverified.
          version-script: ${{ inputs.gtb-from-source && 'pnpm run gtb' || 'pnpm exec gtb' }} version

name: CD

# Reusable: changesets version + publish (npm via OIDC, plus any non-npm
# channels) — the deploy phase. Run by the Release pipeline (release.yml) as
# its `CD` job after CI passes. Both phases go through `gtb` (version: changeset
# version + sync; publish: changeset publish + non-npm channels), so
# the caller must depend on `@gtbuchanan/cli`. The publish job's `release`
# environment and OIDC token resolve in the caller's repo, so the caller must
# grant `id-token: write` and define a `release` environment. Every write to
# the repository goes through the GitHub App token, so neither job needs
# `contents: write` from the caller.
#
# Both jobs mint that token from the APP_ID variable and the APP_PRIVATE_KEY
# secret, each narrowed to what its job writes. The App needs Contents, Pull
# requests and Workflows write: both tokens ask for Workflows whether or not
# the repository releases a `.github` package. Keep the key in the
# `release` environment, with a deployment branch policy for the default
# branch only: a repository secret reaches every workflow run, so any code in
# a same-repository PR's CI could read a key that bypasses the release-tag
# ruleset. A job in an environment reads that environment's secret over any
# the caller passes, so the optional declaration below keeps an explicit or
# inherited repository secret working without reaching around the
# environment one.
on:
  workflow_call:
    inputs:
      gtb-from-source:
        default: false
        description: >-
          Run gtb from the workspace source (`pnpm run gtb`) instead of the
          installed bin (`pnpm exec gtb`). Set true only by the repo that
          vendors `@gtbuchanan/cli` as a workspace package (tooling itself),
          whose bin is not built in these jobs. Consumers leave it false and
          run their installed, prebuilt bin.
        type: boolean
    secrets:
      APP_PRIVATE_KEY:
        description: >-
          GitHub App private key, paired with the APP_ID variable. Optional
          here because it belongs in the `release` environment, which both
          jobs run in; declared so a caller that passes it by name, rather
          than through `secrets: inherit`, is still accepted.
        required: false

permissions:
  contents: read
