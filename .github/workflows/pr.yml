---
# A push supersedes the PR's earlier runs. The group needs its own `-caller`
# part: inside a called workflow `github.workflow` is still this workflow's
# name, so a group a reusable builds from it would otherwise match this one.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-caller-${{ github.event.pull_request.number }}

jobs:
  # Repo-specific, so a consumer copying this file drops it: it runs the bats
  # suites under .github/test, which test this repository's composite actions.
  bats:
    name: Bats Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gtbuchanan/tooling/.github/actions/mise-setup@main

      - uses: gtbuchanan/tooling/.github/actions/pnpm-tasks@main

      - name: Run bats suites
        run: pnpm exec bats --recursive .github/test
        shell: bash
    timeout-minutes: 10

  changeset:
    name: Changeset
    uses: ./.github/workflows/changeset-check.yml
    # This repo vendors @gtbuchanan/cli as a workspace package, so the
    # catalog gate runs gtb from source rather than an installed bin.
    with:
      gtb-from-source: true

  ci:
    name: CI
    permissions:
      contents: read
      id-token: write # Codecov Upload authenticates with OIDC
    uses: ./.github/workflows/ci.yml

  dependencies:
    name: Dependencies
    permissions:
      contents: read
      pull-requests: write # Dependency Review posts a PR comment
    uses: ./.github/workflows/dependency-review.yml
    # Test this PR's own copy of the license policy rather than the
    # remote @main default the base ships to consumers.
    with:
      config-file: .github/dependency-review-config.yml

  pre-commit:
    name: Pre-Commit
    # This repo's eslint step shells out to `pnpm exec eslint`, so hk
    # needs the project's deps installed.
    uses: ./.github/workflows/pre-commit.yml
    with:
      use-pnpm: true

name: PR

# The pull-request pipeline. Each job is a CI check group calling a
# reusable base directly (one nesting level). Job names here are just
# the Checks-tab grouping; the required-check identifiers are the base
# leaf jobs (Build, E2E Test, Dependency Review, ...). Consumers copy
# this file, swapping `./` for
# `gtbuchanan/tooling/.github/workflows/<name>@<tag>`.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
