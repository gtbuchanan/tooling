---
jobs:
  review:
    name: Dependency Review
    permissions:
      contents: read
      pull-requests: write # comment-summary-in-pr posts the summary
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: ${{ inputs.comment-summary-in-pr }}
          config-file: ${{ inputs.config-file }}
          external-repo-token: ${{ github.token }}
          fail-on-severity: ${{ inputs.fail-on-severity }}
    timeout-minutes: 10

  version-check:
    name: Version Check
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: gtbuchanan/tooling/.github/actions/version-check@main
        with:
          minimum-release-age-days: ${{ inputs.minimum-release-age-days }}
    timeout-minutes: 10

name: Dependency Review

on:
  workflow_call:
    inputs:
      comment-summary-in-pr:
        default: on-failure
        description: >-
          When to post a PR summary comment
          (always, never, on-failure).
        type: string
      config-file:
        default: gtbuchanan/tooling/.github/dependency-review-config.yml@main
        description: >-
          Dependency-review config file. Either a path in
          the calling repo or `<owner>/<repo>/<path>@<ref>`
          for a remote file. Defaults to this repo's
          shared license policy.
        required: false
        type: string
      fail-on-severity:
        default: moderate
        description: >-
          Minimum advisory severity that fails the check
          (low, moderate, high, critical).
        type: string
      minimum-release-age-days:
        default: 3
        description: >-
          Quarantine window, in days, for the Version Check.
          A release published within this window is too fresh
          to count as "latest", mirroring Renovate's
          minimumReleaseAge so newly-cut releases don't fail
          the check. Set 0 to compare against the absolute
          latest.
        required: false
        type: number

permissions: {}
