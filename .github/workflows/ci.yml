---
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gtbuchanan/tooling/.github/actions/mise-setup@main

      - uses: gtbuchanan/tooling/.github/actions/turbo-run@main
        with:
          task: build:ci

      # Every artifact step in this workflow comes as a pair. The upstream
      # actions refuse to run on any server_url other than github.com, which
      # they take for GHES, so Forgejo and Gitea get ChristopherHX's forks,
      # which drop that check. `uses:` can't be an expression, hence the `if:`
      # on each half. The forks live on GitHub so a bare `owner/repo@ref`
      # resolves on both forges; the `https://` ref Forgejo also accepts is not
      # a GitHub action reference, and jactionlint rejects it.
      #
      # Both forks stay on v4 rather than the upstream majors. Forgejo 17.0.1
      # rejects the `mime_type` field the v7 upload sends, and the v8 download
      # reports success while leaving the artifact zipped. The forks publish
      # branches rather than tags, and the branches move, so each is pinned to
      # a commit.
      #
      # A repo with no publishable package (all private) legitimately packs
      # nothing, and the tarballs aren't consumed downstream — this artifact is
      # for inspection — so an empty match is not a failure or a warning.
      - if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: packages
          path: |
            dist/packages/npm/*.tgz
            packages/*/dist/packages/npm/*.tgz
      - if: ${{ github.server_url != 'https://github.com' }}
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # v4
        with:
          if-no-files-found: ignore
          name: packages
          path: |
            dist/packages/npm/*.tgz
            packages/*/dist/packages/npm/*.tgz

      # When slow tests are enabled, merged coverage comes from the coverage job.
      # Otherwise, fast-only coverage is the final artifact.
      - if: ${{ inputs.run-slow-tests != true && github.server_url == 'https://github.com' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: coverage
          path: |
            dist/coverage/vitest/fast/
            packages/*/dist/coverage/vitest/fast/
      - if: ${{ inputs.run-slow-tests != true && github.server_url != 'https://github.com' }}
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # v4
        with:
          if-no-files-found: error
          name: coverage
          path: |
            dist/coverage/vitest/fast/
            packages/*/dist/coverage/vitest/fast/
    timeout-minutes: 30

  codecov:
    if: >-
      ${{ !cancelled()
      && needs.build.result == 'success'
      && (needs.coverage.result == 'success'
      || needs.coverage.result == 'skipped') }}
    name: Codecov Upload
    needs: [build, coverage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gtbuchanan/tooling/.github/actions/mise-setup@main

      # The coverage uploads glob both the root and the `packages/*` layout, so
      # the artifact is rooted at the least common ancestor of the two — the
      # workspace. Restoring it there puts each `dist/coverage/` back exactly
      # where its `coverage:codecov:upload` task looks for it, whatever the
      # repo's shape. The step is paired for Forgejo; see the build job.
      - if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: .
      - if: ${{ github.server_url != 'https://github.com' }}
        uses: ChristopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7 # v4
        with:
          name: coverage
          path: .

      # Codecov distributes the CLI as a binary at cli.codecov.io with
      # only a "latest" URL — no versioned downloads. SHA256 validates
      # integrity per release; pin to a version if they add support.
      - name: Install Codecov CLI
        run: |
          curl -Os https://cli.codecov.io/latest/linux/codecov
          curl -Os https://cli.codecov.io/latest/linux/codecov.SHA256SUM
          sha256sum -c codecov.SHA256SUM
          chmod +x codecov
          sudo mv codecov /usr/local/bin/
        shell: bash

      - env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: gtbuchanan/tooling/.github/actions/turbo-run@main
        with:
          task: coverage:codecov:upload
    timeout-minutes: 10

  config-check:
    name: Config Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gtbuchanan/tooling/.github/actions/mise-setup@main

      - uses: gtbuchanan/tooling/.github/actions/pnpm-tasks@main

      - name: Check config drift
        run: pnpm verify
        shell: bash
    timeout-minutes: 10

  coverage:
    if: ${{ inputs.run-slow-tests == true }}
    name: Coverage Merge
    needs: [build, slow-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gtbuchanan/tooling/.github/actions/mise-setup@main

      - uses: gtbuchanan/tooling/.github/actions/turbo-run@main
        with:
          task: coverage:merge

      # Paired for Forgejo; see the build job.
      - if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: coverage
          path: |
            dist/coverage/vitest/merged/
            packages/*/dist/coverage/vitest/merged/
      - if: ${{ github.server_url != 'https://github.com' }}
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # v4
        with:
          if-no-files-found: error
          name: coverage
          path: |
            dist/coverage/vitest/merged/
            packages/*/dist/coverage/vitest/merged/
    timeout-minutes: 10

  e2e:
    if: ${{ inputs.run-e2e == true }}
    name: E2E Test
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gtbuchanan/tooling/.github/actions/mise-setup@main

      # Each e2e fixture runs its own `npm install` into a temp project, so
      # without a warm npm cache every fixture re-downloads the same
      # dependency closure from the registry — which is what makes the suite's
      # wall time track registry latency rather than test work, and what puts
      # tests over their timeout when the registry is slow. This is npm's own
      # cache and is separate from the pnpm store `turbo-run` restores: nothing
      # the workspace install populates is visible to a fixture's npm.
      #
      # The fixtures pin external packages to the versions resolved in this
      # workspace, so the lockfile is what decides which tarballs they ask
      # for. `restore-keys` still gives a partial hit after a bump, where only
      # the changed packages are fetched.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: npm-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: ~/.npm
          restore-keys: |
            npm-e2e-${{ runner.os }}-

      - uses: gtbuchanan/tooling/.github/actions/turbo-run@main
        with:
          task: test:e2e
    timeout-minutes: 30

  slow-tests:
    if: ${{ inputs.run-slow-tests == true }}
    name: Slow Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gtbuchanan/tooling/.github/actions/mise-setup@main

      - uses: gtbuchanan/tooling/.github/actions/turbo-run@main
        with:
          task: test:slow

      # Paired for Forgejo; see the build job.
      - if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: test-results-slow
          path: |
            dist/test-results/
            packages/*/dist/test-results/
      - if: ${{ github.server_url != 'https://github.com' }}
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # v4
        with:
          if-no-files-found: error
          name: test-results-slow
          path: |
            dist/test-results/
            packages/*/dist/test-results/
    timeout-minutes: 30

name: CI

on:
  workflow_call:
    inputs:
      run-e2e:
        default: true
        description: Run e2e tests (artifact tier)
        type: boolean
      run-slow-tests:
        default: false
        description: Run slow source tests
        type: boolean
    secrets:
      CODECOV_TOKEN:
        description: >-
          Codecov upload token (required for private repos,
          optional for public)
        required: false

permissions:
  contents: read
